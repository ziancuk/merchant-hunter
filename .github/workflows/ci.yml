name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '22'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: pcov
      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test --coverage

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    env:
      # Same values scripts/e2e-serve.sh and tests/e2e/support/env.ts use locally.
      APP_ENV: e2e
      HUNTER_BASEMAP: local
      DEMO_USER_PASSWORD: e2e-password-123
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      - run: npx playwright install --with-deps chromium
      # `npm run e2e` starts scripts/e2e-serve.sh through Playwright's webServer: it creates database/e2e.sqlite
      # (migrate:fresh --seed, hunter:demo-reset -> hunter:seed-prospects --offline --seed=42), snapshots it,
      # runs `npm run build` and serves on 127.0.0.1:8001. Specs restore the snapshot per file (workers=1).
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-perf-results
          path: tests/e2e/perf-results.json
          if-no-files-found: ignore
